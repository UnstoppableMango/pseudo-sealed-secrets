---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "operator.fullname" . }}-test-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-5"
data:
  test.sh: |
    #!/bin/sh

    SA=/var/run/secrets/kubernetes.io/serviceaccount
    TOKEN=$(cat "$SA/token")
    K8S=https://kubernetes.default.svc

    k8s() { curl -sf --cacert "$SA/ca.crt" -H "Authorization: Bearer $TOKEN" "$@"; }
    svc() { curl -sf "$@"; }

    # Cleanup any previous run artifacts
    for name in pss-test-sealed pss-test-unsealed; do
      k8s -X DELETE "$K8S/api/v1/namespaces/$NAMESPACE/secrets/$name" > /dev/null 2>&1 || true
    done

    # Test 1: cert endpoint returns a PEM
    printf '==> GET /v1/cert.pem ... '
    PEM=$(svc "$SERVICE_URL/v1/cert.pem")
    echo "$PEM" | grep -q "BEGIN" || { echo "FAIL (no PEM in response)"; exit 1; }
    echo "PASS"

    # Test 2: seal/unseal roundtrip
    printf '==> seal/unseal roundtrip ... '
    SEALED=$(svc -X POST -H "Content-Type: application/json" \
      -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"pss-test-sealed\",\"namespace\":\"$NAMESPACE\"},\"stringData\":{\"password\":\"hunter2\"}}" \
      "$SERVICE_URL/v1/encrypt")

    # Inject target annotation — prepend into metadata object before any existing keys
    ANNOTATED=$(echo "$SEALED" | sed 's|"metadata":{|"metadata":{"annotations":{"pseudo-sealed-secrets.unmango.dev/target":"pss-test-unsealed"},|')

    k8s -X POST -H "Content-Type: application/json" -d "$ANNOTATED" \
      "$K8S/api/v1/namespaces/$NAMESPACE/secrets" > /dev/null

    # Poll until operator reconciles the sealed secret
    RESPONSE=""
    i=0
    while [ "$i" -lt 30 ]; do
      RESPONSE=$(k8s "$K8S/api/v1/namespaces/$NAMESPACE/secrets/pss-test-unsealed" 2>/dev/null) && break
      RESPONSE=""
      sleep 2
      i=$((i + 1))
    done

    [ -n "$RESPONSE" ] || { echo "FAIL (timeout waiting for pss-test-unsealed)"; exit 1; }

    VALUE=$(printf '%s' "$RESPONSE" | grep -o '"password":"[^"]*"' | cut -d'"' -f4 | base64 -d)
    [ "$VALUE" = "hunter2" ] || { echo "FAIL (expected 'hunter2', got '$VALUE')"; exit 1; }
    echo "PASS"

    # Cleanup
    for name in pss-test-sealed pss-test-unsealed; do
      k8s -X DELETE "$K8S/api/v1/namespaces/$NAMESPACE/secrets/$name" > /dev/null 2>&1 || true
    done

    printf '\nAll tests passed!\n'
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "operator.fullname" . }}-test-seal-roundtrip
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "operator.fullname" . }}-test
  containers:
  - name: test
    image: {{ .Values.test.image | default "curlimages/curl:latest" }}
    command: [sh, /scripts/test.sh]
    env:
    - name: SERVICE_URL
      value: "http://{{ include "operator.fullname" . }}:{{ .Values.service.port }}"
    - name: NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    volumeMounts:
    - name: scripts
      mountPath: /scripts
  volumes:
  - name: scripts
    configMap:
      name: {{ include "operator.fullname" . }}-test-script
      defaultMode: 0755
